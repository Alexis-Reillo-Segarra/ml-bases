[project]
name = "ml-bases"
version = "0.1.0"
description = "Fundamentos de Machine Learning: estadística, matemáticas y regresión con notebooks de Jupyter"
readme = "README.md"
authors = [
    { name = "Alexis-Reillo-Segarra", email = "alexisreillo12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false
